name: Checks

# PR gate for the backend (authorization-model-unification, phase 2, task 2.4).
#
# This repository is public and unprotected, so unlike the frontend it CAN carry a
# required status check. This workflow is that check; the equivalent step inside
# deploy.yml / deploy-production.yml is the backstop for pushes that never went
# through a PR.
#
# Do NOT add claude.yml to the required set — it completes with `failure` in ~30 s
# on every backend PR, so requiring it would block every merge.

on:
  pull_request:
    branches: [staging, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'

# One run per PR: a force-push supersedes the in-flight run rather than queueing
# behind it. Safe to cancel here (unlike the deploy workflows, which must not be
# interrupted mid-rollout) because this job only reads.
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-tier-tests:
    name: Unit tests (fast tier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Every test that does not need a database. @QuarkusTest is meta-annotated
      # @Tag("io.quarkus.test.junit.QuarkusTest"), so excluding that tag selects
      # the DB-free tier. The 223 @QuarkusTest classes need a MariaDB service
      # container and are deferred to a later phase.
      - name: Unit tests (fast tier)
        run: ./mvnw -B test -DexcludedGroups=io.quarkus.test.junit.QuarkusTest
