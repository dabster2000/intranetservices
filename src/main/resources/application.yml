quarkus:
  application:
    name: trustworks-intranet
    base-url: ${APPLICATION_BASE_URL:http://127.0.0.1:8080}
  datasource:
    db-kind: mariadb
    metrics:
      enabled: true
    jdbc:
      url: ${URL:jdbc:mariadb://127.0.0.1:3306/twservices?collation=utf8mb4_general_ci}
      driver: org.mariadb.jdbc.Driver
      # Pool sizing — RDS parameter group mariadb10 allows max_connections=200.
      # Peak observed RDS connections to date is ~41, so 64 leaves headroom without
      # crowding other consumers (staging, Lambda, batch jobs).
      min-size: 5
      max-size: 64
      # Wait up to 30s for a connection before failing. The default of 5s combined
      # with PT1M idle-removal caused cold-start bursts to throw
      # "Sorry, acquisition timeout!" en masse (1,800+ events in 48h, see
      # docs/incidents/2026-05-21-kenn-milo-recovery.sql). 30s is safe because we
      # already extended Narayana's default-transaction-timeout to 600s below.
      acquisition-timeout: PT30S
      # Stop aggressively shrinking the pool to min-size every minute. The 1-minute
      # value caused repeated cold-start storms when traffic spikes arrived right
      # after a shrink.
      idle-removal-interval: PT5M
      background-validation-interval: PT2M
      # Surface long-held connections (likely @Transactional methods holding pool
      # connections under load) within 1 minute. The previous PT2M was tightened
      # to PT1M during Wave 1A pool-starvation remediation (2026-05-27) to give
      # faster forensic signal under pool pressure.
      leak-detection-interval: PT1M
      # Emit per-pool Agroal metrics (active count, awaiting count, blocking time,
      # acquisition time, etc.) into the Micrometer registry so that once the
      # CloudWatch registry is wired (W1A.8 / future), agroal_awaiting_count > 0
      # can be alarmed before the pool actually starves. Wave 1A observability
      # addition; today Prometheus is the only configured registry.
      enable-metrics: true
    username: ${USERNAME:root}
    password: ${PASSWORD:1606}
    # Dedicated readiness-probe pool. Reuses the same RDS credentials/URL but lives
    # in its own tiny isolated pool so that when the default pool starves under
    # load, /health/ready still returns 200 — preventing the ALB from killing
    # the task and triggering a kill-restart cascade. Wave 1A addition (2026-05-27).
    # max-size=4: ALB readiness probes can stack (cold-start probe storms, dual-listener
    # configs can put 2-4 in flight). At acquisition-timeout=PT2S, max=2 would fail-fast
    # a 3rd concurrent probe — exactly the scenario this pool exists to prevent.
    '"health"':
      db-kind: mariadb
      jdbc:
        url: ${URL:jdbc:mariadb://127.0.0.1:3306/twservices?collation=utf8mb4_general_ci}
        driver: org.mariadb.jdbc.Driver
        min-size: 1
        max-size: 4
        acquisition-timeout: PT2S
        background-validation-interval: PT1M
      username: ${USERNAME:root}
      password: ${PASSWORD:1606}
  transaction-manager:
    # OpexDistributionRefreshService.refresh() loads ~165k rows from finance_details +
    # fact_user_day and inserts 321 rows in one prepared statement — real duration is
    # 56-60s. The Narayana default of 60s is too tight; staging (1 vCPU) blows past it
    # while production (2 vCPU) succeeds by ~4s. 600s gives generous headroom without
    # masking pathological regressions.
    default-transaction-timeout: 600s
  hibernate-orm:
    jdbc:
      statement-batch-size: 32
    second-level-caching-enabled: true
    statistics: true
    log:
      queries-slower-than-ms: ${PERF_SLOW_QUERY_MS:500}
    unsupported-properties:
      "hibernate.order_inserts": "true"
      "hibernate.order_updates": "true"
  flyway:
    migrate-at-start: true
    repair-at-start: true
    baseline-on-migrate: true
    baseline-version: 1.0
    baseline-description: initial baseline
    out-of-order: true
  swagger-ui:
    # Disabled everywhere. Build-time property: re-enabling requires a rebuild, not just a restart.
    enable: false
    always-include: false
  smallrye-openapi:
    # /q/openapi off too: with the UI gone it had no consumer (3 hits in 30 days, all from the
    # UI itself). Runtime property, so QUARKUS_SMALLRYE_OPENAPI_ENABLED=true reopens it without
    # a rebuild — if you do, confirm mp.openapi.filter below is still taking effect first.
    enabled: false
  keycloak:
    devservices:
      enabled: false
  oidc-client:
    graph:
      auth-server-url: https://login.microsoftonline.com/${AZURE_TENANT_ID:xx}/v2.0
      client-id: ${AZURE_CLIENT_ID:xx}
      credentials:
        client-secret:
          value: ${AZURE_CLIENT_SECRET:xx}
          method: post
      grant:
        type: client
      scopes: https://graph.microsoft.com/.default
  mailer:
    auth-methods: LOGIN
    from: no-reply@trustworks.dk
    host: ${SMTPSERVER:email-smtp.eu-west-1.amazonaws.com}
    port: 587
    start-tls: REQUIRED
    username: ${MAILUSERNAME:xx}
    password: ${MAILPASSWORD:xx}
    mock: false
  http:
    limits:
      max-body-size: 40M
      max-form-attribute-size: 40M
    access-log:
      enabled: true
      pattern: common #"...traceId=%{X,traceId} spanId=%{X,spanId}" #common
    port: 9093 #registry.hub.docker.com/
  smallrye-health:
    root-path: /health
  otel:
    enabled: true
    traces:
      exporter: ${OTEL_TRACES_EXPORTER:none}
    exporter:
      otlp:
        traces:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}
          enabled: ${OTEL_EXPORTER_OTLP_TRACES_ENABLED:false}
  rest-client:
    graph-api:
      url: https://graph.microsoft.com
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 60000
    openai-api:
      url: https://api.openai.com
      scope: jakarta.inject.Singleton
      read-timeout: 110000      # 110 seconds — must complete before BFF timeout (118s)
      connect-timeout: 10000    # 10 seconds for connection establishment
    economics-journals-api:
      url: https://apis.e-conomic.com/journalsapi/v13.0.1
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    economics-customers-api:
      url: https://apis.e-conomic.com/customersapi/v3.1.0
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    economics-q2c-api:
      url: https://apis.e-conomic.com/q2capi/v5.1.0
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    economics-legacy-rest:
      url: https://restapi.e-conomic.com
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    # CV Tool is reached through Azure API Management, not the App Service host
    # directly (tw-cvtool-backend.azurewebsites.net rejects everything with 401
    # since it moved to AzureAD-only auth). Auth is the Ocp-Apim-Subscription-Key
    # header — see CvToolHeadersFactory.
    cvtool:
      url: https://tw-ai-platform-apim.azure-api.net
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    nextsign:
      url: https://www.nextsign.dk
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    nextsign-document:
      url: https://api.nextsign.dk
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
    nextsign-convert:
      url: https://www.nextsign.dk
      scope: jakarta.inject.Singleton
      connect-timeout: 5000       # 5 seconds for connection
      read-timeout: 90000         # 90 seconds for PDF conversion
    virkdata:
      url: https://virkdata.dk
      scope: jakarta.inject.Singleton
      connect-timeout: 5000       # 5 seconds for connection
      read-timeout: 10000         # 10 seconds for CVR API response
    # ATS P21: Airtable Web API (one-shot migration tooling — export the
    # recruitment base for the Airtable → intranet cutover import).
    airtable-api:
      url: https://api.airtable.com
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 60000
    core-threads: 10
    max-threads: 30
  log:
    level: INFO
    handler:
      console:
        "perf":
          enable: true
          format: "%m%n"
    category:
      "dk.trustworks":
        level: INFO
      "dk.trustworks.perf":
        level: INFO
        handlers:
          - perf
        use-parent-handlers: false
      "io.quarkus.http":
        level: INFO
      "org.jboss.resteasy.resteasy_client":
        level: INFO
      "io.quarkus.smallrye.health":
        level: WARN  # This will stop logging health check INFO level messages
      #"io.opentelemetry":
      #  level: DEBUG
    console:
      enable: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] [%X{userUuid}] traceId=%X{traceId} %c{1.} - %m%n"
      #format: "%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n"
      level: DEBUG
      #providers: com. #com.fasterxml.jackson.jaxrs.json.JacksonJsonProvider
  #otel:
  #  exporter:
  #    otlp:
  #      endpoint: http://jaeger:4317 #4317
  cache:
    caffeine:
      "employee-data-per-month-cache":
        expire-after-write: 3H
      employee-budgets:
        expire-after-write: 30M  # Expire after 30 minutes
      employee-availability:
        expire-after-write: 30M  # Expire after 30 minutes
      employee-revenue:
        expire-after-write: 30M
      work-cache:
        expire-after-write: 15M  # Expire after 15 minutes for work data
        maximum-size: 10000  # Maximum number of cached entries
      contract-effective-rules:
        expire-after-write: ${feature.contract.overrides.cache.ttl-seconds:3600}s  # Contract rule override cache
        maximum-size: ${feature.contract.overrides.cache.max-size:1000}  # Maximum cached rule sets
      timesheet-validation-policies:
        expire-after-write: ${TIMESHEET_VALIDATION_POLICY_CACHE_TTL:15M}
        maximum-size: ${TIMESHEET_VALIDATION_POLICY_CACHE_MAX_SIZE:5000}
      client-health:
        expire-after-write: 1H  # Client health cache (1 hour TTL)
        maximum-size: 1000  # Maximum number of client health entries
      consultant-allocation:
        expire-after-write: 1H  # Consultant allocation cache (1 hour TTL)
        maximum-size: 1000  # Maximum number of allocation entries
      page-registry:
        expire-after-write: 5M  # Page registry cache (5 min TTL for quick updates)
        maximum-size: 100  # Small table - only ~20-50 pages expected
      cvr-lookup:
        expire-after-write: 24H  # CVR data rarely changes; cache for 24h to conserve 50/day quota
        maximum-size: 500  # Max cached CVR lookups
  s3:
    sync-client:
      type: APACHE
    aws:
      region: eu-west-1
      credentials:
        # DEFAULT uses the AWS SDK DefaultCredentialsProvider chain.
        # On App Runner this resolves task-role creds from the container
        # metadata endpoint; on ECS the same chain reads from
        # $AWS_CONTAINER_CREDENTIALS_RELATIVE_URI. No static keys.
        type: DEFAULT
  native:
    additional-build-args:
      - -H:IncludeResources=.*\\.pem
      - -H:IncludeResources=META-INF/resources/.*
      - --initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger
      - --initialize-at-run-time=io.netty.util.internal.logging.Log4JLogger


mp:
  jwt:
    verify:
      issuer: https://trustworks.dk
      publickey:
        location: META-INF/resources/publicKey.pem
  openapi:
    # Moved here from quarkus.smallrye-openapi.filter, which Quarkus logs as an unrecognized key
    # and ignores — so this filter never actually ran and /q/openapi published the whole API,
    # not just the /public allowlist. mp.openapi.filter is the key SmallRye reads.
    # Only matters if quarkus.smallrye-openapi.enabled is turned back on.
    filter: dk.trustworks.intranet.security.PublicOnlyOASFilter
feature:
  # Attribution-driven internal invoice line generation (spec 2026-04-21).
  # When true, internal-invoice creation and cascade regeneration derive lines
  # from invoice_item_attributions × source items. Defaults on in every env;
  # flip to false only as an emergency rollback.
  invoicing:
    internal:
      # Override via env var FEATURE_INVOICING_INTERNAL_ATTRIBUTION_DRIVEN or
      # the Quarkus config key `feature.invoicing.internal.attribution-driven`.
      attribution-driven: true
  # Credit-note finalization guard (framework-agreements redesign §9.6).
  # When true, invoice finalization SKIPS invoice-item recalculation for
  # CREDIT_NOTE invoices, preserving the lines copied from the source invoice —
  # a credit note should credit what was BILLED, not what today's pricing rules
  # say. Default false = current behavior (re-run the pricing engine on
  # finalization). Enable only after staging verification against historical
  # credit notes and finance sign-off.
  invoice:
    cn-preserve-lines: false
  # Server-side enforcement for NOTES_REQUIRED and MIN_HOURS_PER_ENTRY.
  # OFF does no contract/rule lookup. Roll out through LOG_ONLY before ENFORCE.
  timesheet:
    rule-enforcement:
      mode: ${FEATURE_TIMESHEET_RULE_ENFORCEMENT_MODE:OFF}
  # Contract Rule Override System feature flags
  contract:
    overrides:
      # Master switch - controls all override functionality
      enabled: true  # Set to true to enable override system

      # Sub-feature flags
      api:
        # Control REST API endpoints availability
        enabled: true  # Set to true to expose override APIs
        read-only: false  # Set to true for read-only mode (no creates/updates/deletes)

      ui:
        # Control UI component visibility (used by frontend)
        enabled: true  # Frontend reads this for menu items, buttons

      # Rollout control
      rollout:
        percentage: 100  # Percentage-based rollout (0-100)
        whitelist: ['50b1c03c-3429-4b3b-b0ed-ab5a59f7dc6f', 'bc5e2eab-1119-4d73-aeb9-e8aba4591cfa', 'd27a7fae-9b40-4a4c-9020-e7eb28fa1a75']  # List of contract UUIDs to enable (for pilot testing)

      # Performance tuning
      cache:
        ttl-seconds: 3600  # 1 hour cache (matching spec)
        max-size: 10000    # Max cached rule sets
invoicing:
  internal:
    # Contact-person name stamped on generated internal invoices. Externalized so
    # no individual's name is embedded in source code. Default is a generic label;
    # override per-environment if a specific contact is desired.
    default-contact-name: ${INVOICING_INTERNAL_DEFAULT_CONTACT_NAME:Trustworks Finance}
slack:
  slackApi: https://slack.com/api
  motherSlackBotToken: ${MOTHERSLACKBOTTOKEN:xx}
  adminSlackBotToken: ${ADMINSLACKBOTTOKEN:xx}
  # Operations alert channel (#ops-alert) — destination for pipeline-health
  # alerts emitted by FactChangeLogBacklogAlertBatchlet. Override per
  # environment if a separate test channel is desired.
  opsAlertChannel: ${SLACK_OPS_ALERT_CHANNEL:C0B2VQ2CFU1}
conference:
  slack:
    per-subject-max: ${CONFERENCE_SLACK_PER_SUBJECT_MAX:10}
    per-subject-delay-ms: ${CONFERENCE_SLACK_PER_SUBJECT_DELAY_MS:1100}
factChangeLog:
  # Daily retention window (in days) for processed change-log rows. Used by
  # ChangeLogRetentionBatchlet — rows whose processed_at is older than this
  # cutoff are deleted in chunks at 02:15 UTC each day.
  retention:
    days: ${FACT_CHANGE_LOG_RETENTION_DAYS:30}
  # Backlog-alert thresholds for FactChangeLogBacklogAlertBatchlet (every 5
  # minutes). Either threshold being breached triggers a Slack message to
  # slack.opsAlertChannel.
  backlogAlert:
    maxPending: ${FACT_CHANGE_LOG_BACKLOG_MAX_PENDING:500}
    maxOldestPendingMinutes: ${FACT_CHANGE_LOG_BACKLOG_MAX_OLDEST_MINUTES:30}
e-conomics:
  xAppSecretToken: ${XAPPSERCREETTOKEN:none}
  xAgreementGrantToken: ${XAGREEMENTGRANTTOKEN:none}
  journal-number: ${JOURNALNUMBER:15}
  expense-journal-number: ${EXPENSEJOURNALNUMBER:15}

# E-conomic revenue auto-import (PR 2 of external-invoice-import).
# When true (default for PR 2), the import service computes a DryRunOutcome
# and emits structured logs WITHOUT inserting any rows. PR 3 flips this off
# co-deployed with V341 for the production cutover.
economics:
  import:
    dry-run: ${ECONOMICS_IMPORT_DRY_RUN:false}
currencyapi:
  key: ${API_KEY:xx}
bucket:
  expenses: expensefiles
  files: trustworksfiles
  invoices: ${INVOICE_S3:invoicefiles-test}
  # Dedicated compliance-hardened store for employee documents (spec §6.1).
  # Wired per env via deploy.yml / deploy-production.yml like INVOICE_S3.
  employee-documents: ${EMPLOYEE_DOCS_S3:trustworks-employee-documents-staging}
edenai:
  api:
    key: ${EDENAI_APIKEY:xx}
openai:
  api:
    key: ${OPENAI_APIKEY:xx}
  model: gpt-5-nano #gpt-4o-mini
  # Model for invoice-attribution AI (InvoiceAttributionAIService). Kept separate from openai.model
  # because attribution sets a low temperature, which the gpt-5 family rejects with HTTP 400 — so
  # this defaults to a gpt-4o-family model the project can access. Override per env with
  # OPENAI_ATTRIBUTION_MODEL.
  attribution-model: ${OPENAI_ATTRIBUTION_MODEL:gpt-4o}
  # Vision-strong model used only by vision + strict-schema calls (e.g. receipt OCR
  # in ExpenseClassificationService). Reasoning-class models like gpt-5-nano burn
  # their output budget on thinking and frequently emit empty structured output for
  # image+schema requests, so vision is routed through a proven vision model.
  vision-model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
  # Model for the Account-Manager invoicing-status brief (AccountManagerBriefService). A capable
  # text model is required to compose the Danish Slack message; the gpt-5 family is fine here since
  # the call never sets temperature. Override per env with OPENAI_INVOICE_STATUS_MODEL.
  # Requires model access on the OpenAI project (enabled 2026-07-04); a 403 here means the
  # project/org lost access — OpenAIService logs the error body.
  invoice-status-model: ${OPENAI_INVOICE_STATUS_MODEL:gpt-5.4}
  # Model for the personalised dashboard daily brief (DailyBriefService). Kept separate from
  # openai.model because the brief is generated with a temperature (~0.8) for day-to-day warmth and
  # variation, which the gpt-5 family rejects with HTTP 400 — so this defaults to a gpt-4o-family
  # model the project can access. Override per env with OPENAI_DAILY_BRIEF_MODEL.
  daily-brief-model: ${OPENAI_DAILY_BRIEF_MODEL:gpt-4o-mini}
  # Model for the consultant sales-profile generator (ConsultantProfileGenerationService — the
  # dashboard "Available Now" card). Deliberately NOT the global openai.model: that default is
  # gpt-5-nano, which spent its whole output budget on hidden reasoning and answered 2xx with no
  # output text (staging 2026-08-01), and gpt-5-nano-2025-08-07 retires 2026-12-11. This call
  # composes customer-facing ENGLISH sales copy from ~13 KB of Danish CV JSON — synthesis, ranking
  # and translation in one, so the mid tier is a quality choice, not a cost one (~145 consultants,
  # weekly cadence). The call never sets temperature, so the gpt-5-family temperature restriction
  # does not apply. Override per env with OPENAI_CONSULTANT_PROFILE_MODEL.
  consultant-profile-model: ${OPENAI_CONSULTANT_PROFILE_MODEL:gpt-5.6-terra}
  # reasoning.effort for that call: none, minimal, low, medium, high, xhigh, max. Condensing a CV
  # into two sentences and a handful of labels is light work, so a low effort leaves the output
  # budget for the actual answer. An EMPTY value omits the reasoning node entirely — REQUIRED if
  # consultant-profile-model is ever pointed at a non-reasoning (gpt-4o-family) model, which
  # rejects the node. That is why the injection point is Optional<String>: with a plain String an
  # empty-but-present value converts to null and Quarkus aborts startup with SRCFG00040 (the trap
  # cvtool.username and cvtool.password already demonstrate in this file) — the defaultValue does
  # NOT rescue it, because the raw value is present.
  consultant-profile-reasoning-effort: ${OPENAI_CONSULTANT_PROFILE_REASONING_EFFORT:low}
# Staging must set EXPENSE_ECONOMICS_UPLOAD_ENABLED=false, INVOICE_ECONOMICS_UPLOAD_ENABLED=false and ENVIRONMENT_ID=staging
# so a staging-sync-polluted DB cannot POST vouchers to e-conomics and, if it ever
# does, cannot reuse production's idempotency keys.
# IMPORTANT: keep this single `dk:` block — SnakeYAML silently lets a later
# duplicate top-level `dk:` mapping override earlier ones, which would drop
# the kill-switch and environment-id properties at parse time.
# (Regression test: ApplicationYamlNoDuplicateKeysTest.)
dk:
  trustworks:
    expense:
      economics-upload:
        enabled: ${EXPENSE_ECONOMICS_UPLOAD_ENABLED:true}
      # Read-side e-conomic sync (expense-sync + expense-orphan-detection).
      # Staging sets EXPENSE_ECONOMICS_SYNC_ENABLED=false so a prod-cloned staging
      # DB never re-syncs against the shared real e-conomic tenant (429-storm fix).
      economics-sync:
        enabled: ${EXPENSE_ECONOMICS_SYNC_ENABLED:true}
        # Re-sync VERIFIED_UNBOOKED plus any row modified within this many days;
        # drops the stable booked/deleted tail from the nightly scan.
        recency-days: ${EXPENSE_ECONOMICS_SYNC_RECENCY_DAYS:30}
        # Per-item 429 retries before counting the item as throttled.
        max-retries: ${EXPENSE_ECONOMICS_SYNC_MAX_RETRIES:3}
        # Consecutive throttled items that trip the circuit breaker (abort run).
        abort-threshold: ${EXPENSE_ECONOMICS_SYNC_ABORT_THRESHOLD:15}
        # Optional inter-item sleep in ms (0 = off).
        pacing-ms: ${EXPENSE_ECONOMICS_SYNC_PACING_MS:0}
      ai:
        # ---- Receipt OCR (ExpenseClassificationService, vision + strict schema) ----
        # Deliberately NOT the global openai.vision-model. That property's only
        # remaining consumer is the recruitment CV/document intake path
        # (AiIntakeGenerationService, via OpenAIService.getVisionModel()) — the
        # calendar-image path has since moved to its own
        # dk.trustworks.recruitment.ai.image-model. It is pinned to gpt-4o-mini
        # because, until 2026-08-18, the vision + strict-schema path in OpenAIService
        # could not send a reasoning node at all (it called the four-argument
        # baseSchemaRequest). Reading a crumpled, angled or low-light receipt is a
        # real visual task, so this path gets its own model knob. Volume is a few
        # hundred receipts a month. Override per env with
        # DK_TRUSTWORKS_EXPENSE_AI_RECEIPT_MODEL.
        receipt-model: ${DK_TRUSTWORKS_EXPENSE_AI_RECEIPT_MODEL:gpt-4o-mini}
        # reasoning.effort for the receipt read: none, minimal, low, medium, high,
        # xhigh, max. An EMPTY value omits the reasoning node entirely — and EMPTY is
        # the default here precisely because receipt-model defaults to gpt-4o-mini,
        # a non-reasoning model that rejects the node with HTTP 400. Set this only
        # together with a reasoning-class receipt-model. Optional<String> at the
        # injection point: with a plain String an empty-but-present value converts to
        # null and Quarkus aborts startup with SRCFG00040 (the trap cvtool.username
        # and cvtool.password already demonstrate in this file) — the defaultValue
        # does NOT rescue it, because the raw value is present.
        receipt-reasoning-effort: ${DK_TRUSTWORKS_EXPENSE_AI_RECEIPT_REASONING_EFFORT:}
        # max_output_tokens for the receipt call.
        #
        # WARNING: this, receipt-model and receipt-reasoning-effort move TOGETHER.
        # A reasoning model spends the same max_output_tokens budget on hidden
        # reasoning first, so raising the model or the effort without raising this
        # reproduces exactly the empty-structured-output failure documented on
        # openai.vision-model (a 2xx response carrying no output text).
        receipt-max-output-tokens: ${DK_TRUSTWORKS_EXPENSE_AI_RECEIPT_MAX_OUTPUT_TOKENS:8192}
        # input_image detail. "high" stops the Responses API downsampling a photo
        # before the model can read the amount, VAT line and date on it. An EMPTY
        # value omits the field (API default). Optional<String> for the same
        # SRCFG00040 reason as receipt-reasoning-effort above.
        receipt-image-detail: ${DK_TRUSTWORKS_EXPENSE_AI_RECEIPT_IMAGE_DETAIL:}
    invoice:
      economics-upload:
        enabled: ${INVOICE_ECONOMICS_UPLOAD_ENABLED:true}
      # Read-side e-conomic sync (economics-invoice-status-sync). Staging false.
      economics-sync:
        enabled: ${INVOICE_ECONOMICS_SYNC_ENABLED:true}
        # Only poll BOOKED invoices issued within this many days for BOOKED->PAID;
        # bounds an otherwise unbounded daily scan. Generous default: real payments
        # land well inside a year. Widen if the "older than cutoff not polled" log grows.
        recency-days: ${INVOICE_ECONOMICS_SYNC_RECENCY_DAYS:365}
    finance:
      # Read-side e-conomic load (finance-load-economics). Staging false.
      economics-load:
        enabled: ${FINANCE_ECONOMICS_LOAD_ENABLED:true}
    recruitment:
      ai:
        # Model for the P16 AI email composer (AiEmailDraftService) — drafts
        # personalised candidate emails from Danish templates. Runs with
        # temperature 0.7 for natural prose, which the gpt-5 family rejects
        # with HTTP 400, so this must stay a gpt-4o-family (temperature-
        # capable) model. Override per env with
        # DK_TRUSTWORKS_RECRUITMENT_AI_DRAFT_MODEL.
        draft-model: ${DK_TRUSTWORKS_RECRUITMENT_AI_DRAFT_MODEL:gpt-4o-mini}
        # Model for the strict-schema EXTRACTION calls — P9 candidate intake
        # (AiIntakeGenerationService, text path) and referral triage
        # (AiReferralTriageReactor). Deliberately NOT the global openai.model:
        # that default is gpt-5-nano, which spent its whole output budget on
        # hidden reasoning and answered 2xx with no output text (staging
        # 2026-08-01 — "AI intake generation returned no usable output" 500s),
        # and gpt-5-nano-2025-08-07 retires 2026-12-11 with gpt-5.6-luna named
        # by OpenAI as its replacement. Terra is the mid tier of that family;
        # this workload is tens of CVs/month, so the tier is a quality choice,
        # not a cost one. Both models support strict structured outputs
        # (including minItems/maxItems, which the brief schema uses). Neither
        # path sets temperature, so the gpt-5-family temperature restriction
        # does not apply here. Override per env with
        # DK_TRUSTWORKS_RECRUITMENT_AI_EXTRACTION_MODEL.
        extraction-model: ${DK_TRUSTWORKS_RECRUITMENT_AI_EXTRACTION_MODEL:gpt-5.6-terra}
        # reasoning.effort for those extraction calls: none, minimal, low,
        # medium, high, xhigh, max. Pulling facts out of a CV is mechanical, so
        # a low effort leaves the output budget for the actual answer. An EMPTY
        # value omits the reasoning node entirely — REQUIRED if extraction-model
        # is ever pointed at a non-reasoning (gpt-4o-family) model, which
        # rejects the node. That is why the injection point is Optional<String>:
        # with a plain String an empty-but-present value converts to null and
        # Quarkus aborts startup with SRCFG00040 (the trap cvtool.username and
        # cvtool.password already demonstrate in this file) — the defaultValue
        # does NOT rescue it, because the raw value is present.
        extraction-reasoning-effort: ${DK_TRUSTWORKS_RECRUITMENT_AI_EXTRACTION_REASONING_EFFORT:low}
        # ---- Calendar-image availability reading (Method B, Phase 13 v2) ----
        # Deliberately NOT the global openai.vision-model. That property's only
        # remaining consumer is the CV/document intake path
        # (AiIntakeGenerationService) — expense receipt OCR has since moved to its
        # own dk.trustworks.expense.ai.receipt-model. It is pinned to gpt-4o-mini
        # because,
        # until 2026-08-18, the vision + strict-schema path in OpenAIService
        # could not send a reasoning node at all (it called the four-argument
        # baseSchemaRequest). Reading a calendar grid is spatial arithmetic —
        # find the hour gutter, measure each block's edges against it — and on
        # a mini tier at the API's default image detail it failed badly in
        # production: two genuinely empty weekdays came back fully booked, and
        # not one returned boundary landed on a :15/:30/:45 against a calendar
        # full of them. This path therefore gets its own reasoning-class model.
        # Volume is a handful of images a month, so the tier is a quality
        # choice, not a cost one. Override per env with
        # DK_TRUSTWORKS_RECRUITMENT_AI_IMAGE_MODEL.
        image-model: ${DK_TRUSTWORKS_RECRUITMENT_AI_IMAGE_MODEL:gpt-5.6-terra}
        # reasoning.effort for the image transcription. Medium, not low: the
        # measuring IS the hard part here, unlike CV fact extraction. An EMPTY
        # value omits the node entirely — REQUIRED if image-model is ever
        # pointed at a gpt-4o-family model, which rejects it. Optional<String>
        # for the same SRCFG00040 reason as extraction-reasoning-effort above.
        #
        # WARNING: this and IMAGE_MAX_OUTPUT_TOKENS in
        # AvailabilityExtractionService move TOGETHER. A reasoning model spends
        # the same max_output_tokens budget on hidden reasoning first, so
        # raising the model or the effort without the budget reproduces exactly
        # the empty-structured-output failure documented on openai.vision-model.
        image-reasoning-effort: ${DK_TRUSTWORKS_RECRUITMENT_AI_IMAGE_REASONING_EFFORT:medium}
        # input_image detail. "high" stops the Responses API downsampling a
        # dense ~1300x800 screenshot before the model can see its gridlines and
        # quarter-hour edges. An EMPTY value omits the field (API default).
        image-detail: ${DK_TRUSTWORKS_RECRUITMENT_AI_IMAGE_DETAIL:high}
        # ---- Onboarding document VALIDATION (OnboardingDocumentValidationService) ----
        # This does NOT generate any document. The only consumer READS an uploaded
        # koerekort, sundhedskort or straffeattest and answers a strict schema with
        # an approve/reject decision — a vision + strict-schema call, so the value
        # MUST be a vision-capable model. Point it at a text-only model and every
        # input_image request fails with HTTP 400, which on this fail-closed
        # @PermitAll gate hard-blocks every onboarding document upload with no human
        # override anywhere. Kept separate from extraction-model, which is a
        # reasoning-class model tuned for pulling facts out of CV text: a
        # reasoning-class model spends its max_output_tokens budget on hidden
        # reasoning and answers 2xx with NO output text for image + schema requests,
        # and that empty output parses as a rejection of a perfectly valid document.
        # Hence the proven non-reasoning gpt-4o-family vision default. Override per
        # env with DK_TRUSTWORKS_RECRUITMENT_AI_ONBOARDING_DOC_MODEL.
        onboarding-doc-model: ${DK_TRUSTWORKS_RECRUITMENT_AI_ONBOARDING_DOC_MODEL:gpt-4o-mini}
        # max_output_tokens for that call.
        #
        # WARNING: this and onboarding-doc-model move TOGETHER (and with a
        # reasoning-effort knob, should one ever be added here). A reasoning-class
        # model spends the same max_output_tokens budget on hidden reasoning first,
        # so raising the model alone reproduces exactly the empty-structured-output
        # failure documented on openai.vision-model — a 2xx response with no output
        # text.
        onboarding-doc-max-output-tokens: ${DK_TRUSTWORKS_RECRUITMENT_AI_ONBOARDING_DOC_MAX_OUTPUT_TOKENS:8192}
      # P17 SLA sweep (recruitment-sla-sweep, daily 07:00 UTC): kill switch
      # for the nudge DMs. The sweep is additionally a no-op while the
      # recruitment.interviews.enabled app setting is off; the three
      # thresholds live in app_settings (recruitment.sla.*, V447 seeds).
      sla-sweep:
        enabled: ${DK_TRUSTWORKS_RECRUITMENT_SLA_SWEEP_ENABLED:true}
      # P19 GDPR sweep (recruitment-gdpr-sweep, daily 05:45 UTC): kill
      # switch for the whole clock (consent expiry, renewal emails,
      # auto-anonymization). The sweep is additionally a no-op while the
      # recruitment.gdpr.enabled app setting is off — that flag, not this
      # property, is the deliberate "automatic deletion starts now"
      # decision (plan §P19); cadence lives in app_settings
      # (recruitment.gdpr.*, V448 seeds).
      gdpr-sweep:
        enabled: ${DK_TRUSTWORKS_RECRUITMENT_GDPR_SWEEP_ENABLED:true}
      # P19 public consent page: base URL the tokenized /consent/[token]
      # links in renewal emails are built on (the intranet frontend hosts
      # the page, excluded from its auth gate like /apply).
      consent:
        base-url: ${DK_TRUSTWORKS_RECRUITMENT_CONSENT_BASE_URL:https://intra.trustworks.dk}
      # P21 Airtable migration tooling. Inert until token + base-id are set
      # (the admin endpoints answer 503). The token is an Airtable personal
      # access token scoped data.records:read + schema.bases:read on the
      # recruitment base — one-shot credentials for the cutover, removed
      # from the environment after Airtable retirement.
      airtable:
        token: ${AIRTABLE_TOKEN:}
        base-id: ${AIRTABLE_BASE_ID:}
        # Comma-separated table names in the base that are NOT candidate
        # pipelines (lookup/config tables) and must not be imported.
        excluded-tables: ${AIRTABLE_EXCLUDED_TABLES:}
      # Method B interview scheduling (candidate-option scheduling, plan
      # 2026-08-12): placeholder holds, Slack interviewer coordination,
      # the candidate option page. Default OFF — every Method B phase
      # merges dark behind this flag; independent of
      # dk.trustworks.recruitment.graph.calendar.enabled (Method A).
      # Deliberately a config property, not an app_settings row: the
      # staging nightly refresh re-seeds app_settings and would flip an
      # app-settings-backed flag off mid-soak. Per D8 staging turns it on
      # only when Phase 13 (image evidence) is done; production only
      # after the spec §27 scenario matrix passes on staging.
      scheduling:
        methodb:
          enabled: ${DK_TRUSTWORKS_RECRUITMENT_SCHEDULING_METHODB_ENABLED:false}
    practice:
      # Daily practice reconciliation tick (Part 2 Phase 2, spec §4.2).
      # 06:20 UTC: outside the 02:00–05:00 CET quiet window (staging refresh,
      # BI nightly, expense-sync). Env-overridable so a local/dev run can fire
      # it on demand; the job is idempotent and convergent at any cadence.
      reconciliation:
        cron: ${PRACTICE_RECONCILIATION_CRON:0 20 6 * * ?}
    environment:
      id: ${ENVIRONMENT_ID:production}
    intranet:
      expenseservice:
        remote:
          EconomicsAPI/mp-rest/url: https://restapi.e-conomic.com
          EconomicsAPIFile/mp-rest/url: https://restapi.e-conomic.com
          EconomicsAPIAccount/mp-rest/url: https://restapi.e-conomic.com
      aggregates:
        accounting:
          salary-buffer-multiplier: 1.02  # 2% buffer for salary calculations
        invoice:
          network:
            CurrencyAPI/mp-rest/url: https://api.freecurrencyapi.com
      opex-distribution:
        refresh-window-fy-back: 1
        max-staleness-hours: 30
      # E-conomic revenue auto-import (PR 2 of external-invoice-import).
      # Freshness threshold for EconomicRevenueImportFreshnessCheck. Stays
      # close to the 24h cron cadence; +1h grace covers clock skew + retry.
      economic-revenue-import:
        max-staleness-hours: 25
    perf:
      metrics:
        enabled: ${PERF_METRICS_ENABLED:true}
      env: ${PERF_ENV:production}
      digest:
        enabled: ${PERF_DIGEST_ENABLED:false}   # nightly analyzer off by default; enable per-env
      log-group: ${PERF_LOG_GROUP:${CLOUDWATCH_LOG_GROUP_BACKEND:/ecs/tw-quarkus-unknown}}
finance:
  # F3 — internal-cost timing alignment for the Expected Accumulated EBITDA chart.
  # Internal (intercompany) revenue is bucketed on the issuer's invoicedate, but the
  # matching debtor cost (CREATED INTERNAL, GL accounts 3050/3055/3070/3075/1350) posts
  # on the later expensedate. When ON, CxoFinanceService re-times that CREATED-internal
  # cost onto the invoicedate month (add synthesized invoicedate cost, subtract the GL
  # expensedate copy already in the direct-cost feed — no double count, FY totals
  # conserved). DEFAULT false (prod-safe, byte-identical to today). Enable in staging
  # first to validate against a fully-closed fiscal year before promoting to prod.
  internal-cost-timing-alignment:
    enabled: ${FINANCE_INTERNAL_COST_TIMING_ALIGNMENT_ENABLED:false}
pricingEngine:
  enabled: true
cvtool:
  # Azure API Management subscription key, sent as Ocp-Apim-Subscription-Key on
  # every CV Tool call. Sourced from the Secrets Manager entry
  # tw-quarkus-secrets-{env}:CVTOOL_SUBSCRIPTION_KEY in deployed environments.
  # Replaced the old cvtool.username/password pair — the CV Tool backend removed
  # POST /auth/login, which broke the nightly sync silently.
  subscription-key: ${CVTOOL_SUBSCRIPTION_KEY:}
  sync:
    # How many employees may fail before the whole nightly run is failed. The tighter
    # of the two caps governs. Observed transient rate is 2 (2026-08-12: two 30s read
    # timeouts out of 148, with 128 CVs written); the known real defect was 9 of 136.
    # Under the cap the run stays COMPLETED and logs CVTOOL_SYNC_PARTIAL_FAILURE at
    # ERROR; over it, the job throws as before.
    failure-threshold: ${CVTOOL_SYNC_FAILURE_THRESHOLD:3}
    failure-percent: ${CVTOOL_SYNC_FAILURE_PERCENT:5.0}

# Generation and pre-warm controls for the AI consultant sales profiles that back the dashboard
# "Available Now" card. Generation NEVER runs on the request thread (see
# ConsultantProfileService): the GET serves cache + deterministic CV facts and enqueues.
consultant-profile:
  generation:
    # Master kill switch for all OpenAI calls in this feature (on-demand and pre-warm).
    # With this off the card still renders: deterministic CV facts are computed on read.
    enabled: ${CONSULTANT_PROFILE_GENERATION_ENABLED:true}
    # Minimum wait before a failed generation is retried. Failures deliberately leave
    # generated_at NULL (so the row is never served as fresh), which makes isStale() permanently
    # true — this backoff is what stops a failing consultant from firing OpenAI on every load.
    retry-backoff-minutes: ${CONSULTANT_PROFILE_RETRY_BACKOFF_MINUTES:30}
    # Consecutive failures after which the row is parked as UNAVAILABLE and stops being retried.
    max-attempts: ${CONSULTANT_PROFILE_MAX_ATTEMPTS:3}
  prewarm:
    # Ships OFF. The nightly job proactively sends every active consultant's full CV (real name,
    # employment history, education, certifications, client engagements) to a US processor —
    # processing that no employee triggered. Two gates must clear before it is switched on with
    # CONSULTANT_PROFILE_PREWARM_ENABLED=true, in this order:
    #   1. privacy sign-off that bulk, unattended CV transmission is inside the documented ROPA
    #      purpose (store=false only disables Responses-API state, not the transfer itself);
    #   2. the quality gate this feature's contract already requires — generate ~10 profiles in
    #      staging and read the English output by hand, since gpt-5.6-terra is unbenchmarked on
    #      Danish CV JSON.
    # With this off the card still fills itself: the read path enqueues generation on demand.
    enabled: ${CONSULTANT_PROFILE_PREWARM_ENABLED:false}
    # Consultants generated per nightly run. Caps one night's OpenAI spend; the ~106 consultants
    # with no profile drain over a few nights.
    batch-size: ${CONSULTANT_PROFILE_PREWARM_BATCH_SIZE:40}
    # Pause between consultants inside a run — the sequential loop is the rate limiter.
    pause-ms: ${CONSULTANT_PROFILE_PREWARM_PAUSE_MS:1000}

nextsign:
  company: ${NEXTSIGN_COMPANY:69313a4a3abed8e75359da3f}
  bearer-token: ${NEXTSIGN_BEARER_TOKEN:key_z5TGFFHtbIzmHgZfChogJkibyuTOsEJC0PM6kAHP36TFcbrckrAnrLbQewBLZu7D}

